<!DOCTYPE html>
<!-- @dsCard group="Components" name="tables" subtitle="Reference table — profile matrix" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Reference tables</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);color:var(--waft-ink);font-family:var(--waft-font-sans)}
  .wrap{padding:22px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--waft-line)}
  th{font-weight:700;font-size:11.5px;color:var(--waft-ink-soft);text-transform:uppercase;letter-spacing:.04em;background:var(--waft-subtle)}
  td:first-child code{background:transparent;color:#0f6e61;font-weight:600}
  code{font-family:var(--waft-font-mono);font-size:12.5px;background:var(--waft-subtle);padding:1px 5px;border-radius:3px;color:var(--waft-ink)}
</style></head><body><div class="wrap"><table>
  <thead><tr><th>Profile</th><th>Missing <code>.worktreeinclude</code></th><th>Matcher</th><th>Symlinks</th></tr></thead>
  <tbody>
  <tr><td><code>claude</code></td><td>nothing selected</td><td><code>claude-2026-04</code></td><td>follow</td></tr>
  <tr><td><code>git</code></td><td>nothing selected</td><td><code>git</code></td><td>ignore</td></tr>
  <tr><td><code>wt</code></td><td>every git-ignored untracked file</td><td><code>wt-0.39</code></td><td>follow</td></tr>
  </tbody>
</table></div></body></html>
