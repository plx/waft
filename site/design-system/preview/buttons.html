<!DOCTYPE html>
<!-- @dsCard group="Components" name="buttons" subtitle="Primary / secondary / ghost" viewport="700x210" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);color:var(--waft-ink);font-family:var(--waft-font-sans)}
  .wrap{padding:22px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .label{font-family:var(--waft-font-mono);font-size:10.5px;color:var(--waft-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;min-width:88px}
  .btn{min-height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--waft-line);border-radius:4px;background:#fff;color:#1f2328;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;box-shadow:0 1px 2px rgb(16 24 40 / 6%)}
  .btn--primary{background:var(--waft-accent-dark);border-color:var(--waft-accent-dark);color:var(--waft-surface)}
  .btn--ghost{background:transparent;box-shadow:none}
  .btn:focus-visible{outline:2px solid var(--waft-focus);outline-offset:2px}
  .ic{width:14px;height:14px;display:inline-block;border:2px solid currentColor;border-radius:2px}
</style></head><body><div class="wrap">
  <div class="row"><span class="label">primary</span><a class="btn btn--primary" href="#">Read the docs</a><a class="btn btn--primary" href="#"><span class="ic"></span>Copy command</a></div>
  <div class="row"><span class="label">secondary</span><a class="btn" href="#">View on GitHub</a><a class="btn" href="#">Inspect</a></div>
  <div class="row"><span class="label">ghost</span><a class="btn btn--ghost" href="#">Dismiss</a><a class="btn btn--ghost" href="#">Cancel</a></div>
</div></body></html>
