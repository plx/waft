<!DOCTYPE html>
<!-- @dsCard group="Type" name="type-scale" subtitle="Size ladder" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);color:var(--waft-ink);font-family:var(--waft-font-sans)}
  .wrap{padding:18px 22px}
  table{border-collapse:collapse;width:100%;font-family:var(--waft-font-mono);font-size:12px}
  td{padding:6px 0;vertical-align:baseline;border-bottom:1px solid var(--waft-line)}
  td:first-child{color:var(--waft-muted);width:120px}
  td:nth-child(2){color:var(--waft-ink-soft);width:140px}
  td:last-child{font-family:var(--waft-font-sans);color:var(--waft-ink);font-weight:600}
</style></head><body><div class="wrap"><table>
  <tr><td>display</td><td>clamp(3rem,8vw,6rem)</td><td style="font-size:32px;line-height:1;font-weight:800">Aa</td></tr>
  <tr><td>h2</td><td>clamp(1.75,4vw,2.75)</td><td style="font-size:24px;line-height:1;font-weight:800">Aa</td></tr>
  <tr><td>h3</td><td>1.2rem / 19.2px</td><td style="font-size:19.2px;font-weight:700">Aa</td></tr>
  <tr><td>lede</td><td>1.125rem / 18px</td><td style="font-size:18px;font-weight:500;color:var(--waft-ink-soft)">Aa</td></tr>
  <tr><td>body</td><td>1rem / 16px</td><td style="font-size:16px">Aa</td></tr>
  <tr><td>sm</td><td>0.875rem / 14px</td><td style="font-size:14px">Aa</td></tr>
  <tr><td>xs / badge</td><td>0.75rem / 12px</td><td style="font-size:12px;font-family:var(--waft-font-mono)">Aa</td></tr>
</table></div></body></html>
