<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Waft</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--waft-font-sans)}
  .main{flex:1;display:flex;align-items:center;justify-content:center;background:var(--waft-accent);color:#f7f8f6}
  .main span{font-size:280px;font-weight:800;letter-spacing:-0.03em;line-height:1}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip > div{flex:1}
</style></head>
<body>
<div class="tile">
  <div class="main"><span>waft</span></div>
  <div class="strip">
    <div style="background:#d6c24a"></div>
    <div style="background:#b42323"></div>
    <div style="background:#0f6e61"></div>
  </div>
</div>
</body></html>
