<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Site" name="ui-kit-site" subtitle="Docs site — landing + 6 doc pages" viewport="1280x720" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>waft · UI kit</title>
  <link rel="icon" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Chrome.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel" src="DocsPage.jsx"></script>

  <script type="text/babel">
    function App() {
      // initial screen comes from hash if present
      const initialFromHash = () => {
        const h = window.location.hash.replace("#", "");
        if (h === "" || h === "overview") return "landing";
        if (window.DOC_PAGES && window.DOC_PAGES.some((p) => p.slug === h)) return h;
        if (h === "usage" || h === "worktreeinclude" || h === "safety" ||
            h === "profiles" || h === "configuration" || h === "architecture") return h;
        return "landing";
      };
      const [screen, setScreen] = React.useState(initialFromHash());

      const navigate = (next) => {
        setScreen(next);
        if (next === "landing") {
          history.replaceState(null, "", "#overview");
        } else {
          history.replaceState(null, "", "#" + next);
        }
        // soft scroll to top inside the iframe
        document.documentElement.scrollTo({ top: 0, behavior: "smooth" });
      };

      // The "doc" screens use the DocsPage layout; "landing" gets hero + sections.
      const isDoc = screen !== "landing";
      const screenLabel = screen === "landing" ? "01 Landing" : "Docs · " + screen;

      return (
        <div data-screen-label={screenLabel}>
          <Header
            screen={isDoc ? screen : "landing"}
            onNavigate={navigate}
          />
          {screen === "landing" ? (
            <>
              <Hero onNavigate={navigate} />
              <FeatureGrid onNavigate={navigate} />
              <DocsPreview onNavigate={navigate} />
            </>
          ) : (
            <DocsPage slug={screen} onNavigate={navigate} />
          )}
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
