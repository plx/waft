<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="spacing-scale" subtitle="Recurring rem beats" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);color:var(--waft-ink);font-family:var(--waft-font-sans)}
  .wrap{padding:22px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:14px;font-family:var(--waft-font-mono);font-size:11.5px;color:var(--waft-muted)}
  .row b{color:var(--waft-ink);font-weight:700;width:60px;display:inline-block}
  .row span.val{width:60px}
  .bar{height:14px;background:#16a085;border-radius:2px}
</style></head><body><div class="wrap">
  <div class="row"><b>sp-1</b><span class="val">0.25rem</span><span class="bar" style="width:4px"></span><span>gap, dense rows</span></div>
  <div class="row"><b>sp-2</b><span class="val">0.5rem</span><span class="bar" style="width:8px"></span><span>chip gap, button icon gap</span></div>
  <div class="row"><b>sp-3</b><span class="val">0.75rem</span><span class="bar" style="width:12px"></span><span>card padding, feature grid gap</span></div>
  <div class="row"><b>sp-4</b><span class="val">1rem</span><span class="bar" style="width:16px"></span><span>card padding</span></div>
  <div class="row"><b>sp-5</b><span class="val">1.5rem</span><span class="bar" style="width:24px"></span><span>nav gap, section heading mb</span></div>
  <div class="row"><b>sp-6</b><span class="val">2rem</span><span class="bar" style="width:32px"></span><span>hero actions mt</span></div>
  <div class="row"><b>sp-7</b><span class="val">2.5rem</span><span class="bar" style="width:40px"></span><span>hero grid gap</span></div>
  <div class="row"><b>sp-8</b><span class="val">3.5rem</span><span class="bar" style="width:56px"></span><span>section padding-block</span></div>
</div></body></html>
