<!DOCTYPE html>
<!-- @dsCard group="Colors" name="colors-neutrals" subtitle="Ink, surface, lines" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);font-family:var(--waft-font-sans);color:var(--waft-ink)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{border:1px solid var(--waft-line);border-radius:var(--waft-radius);background:var(--waft-panel);overflow:hidden;box-shadow:var(--waft-shadow)}
  .chip{height:64px}
  .meta{padding:9px 11px;font-size:11px;line-height:1.4}
  .meta b{display:block;font-weight:700;font-size:12.5px;color:var(--waft-ink);margin-bottom:2px}
  .meta code{font-family:var(--waft-font-mono);color:var(--waft-muted);font-size:11px}
  .row2{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#1f2328"></div><div class="meta"><b>ink</b><code>#1f2328</code></div></div>
  <div class="sw"><div class="chip" style="background:#3d4650"></div><div class="meta"><b>ink-soft</b><code>#3d4650</code></div></div>
  <div class="sw"><div class="chip" style="background:#6b7280"></div><div class="meta"><b>muted</b><code>#6b7280</code></div></div>
  <div class="sw"><div class="chip" style="background:#c8cdd3"></div><div class="meta"><b>line-strong</b><code>#c8cdd3</code></div></div>
  <div class="sw"><div class="chip" style="background:#e2e5e9"></div><div class="meta"><b>line</b><code>#e2e5e9</code></div></div>
  <div class="sw"><div class="chip" style="background:#eef2f1"></div><div class="meta"><b>subtle</b><code>#eef2f1</code></div></div>
  <div class="sw"><div class="chip" style="background:#f7f8f6"></div><div class="meta"><b>surface</b><code>#f7f8f6</code></div></div>
  <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="meta"><b>panel</b><code>#ffffff</code></div></div>
</div></body></html>
