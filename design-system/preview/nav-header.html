<!DOCTYPE html>
<!-- @dsCard group="Components" name="nav-header" subtitle="Sticky header w/ theme toggle" viewport="700x120" -->
<html data-theme="auto"><head><meta charset="utf-8"><title>Header & nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);color:var(--waft-ink);font-family:var(--waft-font-sans)}
  .header{position:relative;border-bottom:1px solid var(--waft-line);background:color-mix(in srgb,var(--waft-surface) 88%,transparent);backdrop-filter:blur(14px)}
  .inner{display:flex;align-items:center;gap:20px;min-height:56px;padding:0 22px}
  .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;text-decoration:none;color:var(--waft-ink)}
  .brand svg{width:28px;height:28px;display:block}
  .links{display:flex;gap:4px;margin-left:auto}
  .links a{position:relative;display:inline-flex;align-items:center;min-height:32px;padding:0 10px;color:var(--waft-muted);font-size:13.5px;font-weight:700;text-decoration:none;transition:color .12s}
  .links a::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--waft-accent);opacity:0;transform:scaleX(.4);transform-origin:center;transition:opacity .14s,transform .14s}
  .links a:hover{color:var(--waft-ink)}
  .links a.active{color:var(--waft-ink)}
  .links a.active::after{opacity:1;transform:scaleX(1)}
  .actions{display:flex;align-items:center;gap:10px;margin-left:4px}

  /* ── Theme toggle ── */
  .theme-toggle{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--waft-line);border-radius:999px;background:var(--waft-subtle)}
  .theme-toggle__btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--waft-muted);cursor:pointer;transition:color .12s,background .12s}
  .theme-toggle__btn:hover{color:var(--waft-ink)}
  .theme-toggle__btn[aria-checked="true"]{background:var(--waft-panel);color:var(--waft-accent-dark);box-shadow:var(--waft-shadow)}
  .theme-toggle__btn svg{width:16px;height:16px;display:block}
  .theme-toggle__btn:focus-visible{outline:2px solid var(--waft-focus);outline-offset:2px}
  /* hover tooltip */
  .theme-toggle__btn::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:5px;background:var(--waft-ink);color:var(--waft-surface);font-size:11px;font-weight:600;line-height:1;white-space:nowrap;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
  .theme-toggle__btn:hover::after,.theme-toggle__btn:focus-visible::after{opacity:1}

  .btn{min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid var(--waft-line);border-radius:4px;background:var(--waft-panel);color:var(--waft-ink);font-weight:700;font-size:13.5px;text-decoration:none}
  .btn--primary{background:var(--waft-accent-dark);border-color:var(--waft-accent-dark);color:var(--waft-surface)}
</style></head><body><header class="header"><div class="inner">

4s-1.794,4-4,4s-4-1.794-4-4S37.794,36,40,36z"></path><circle cx="15" cy="15" r="2" fill="var(--waft-accent)"></circle><circle cx="65" cy="15" r="2" fill="var(--waft-accent)"></circle><circle cx="15" cy="65" r="2" fill="var(--waft-accent)"></circle><circle cx="65" cy="65" r="2" fill="var(--waft-accent)"></circle></g></svg>waft</a>

    <div class="theme-toggle" role="radiogroup" aria-label="Color theme">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </button>
      <button type="button" class="theme-toggle__btn" role="radio" data-theme-choice="dark" data-tip="Dark" aria-label="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"></path></svg>
      </button>
      <button type="button" class="theme-toggle__btn" role="radio" data-theme-choice="auto" data-tip="Follow system" aria-label="Follow system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="12.5" rx="1.5"></rect><path d="M8.5 20.5h7M12 16.5v4"></path></svg>
      </button>
    </div>

</div></header>
<script>
(function(){
  var KEY="waft-theme";
  var root=document.documentElement;
  var btns=[].slice.call(document.querySelectorAll(".theme-toggle__btn"));
  function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function apply(choice){
    if(choice==="light"||choice==="dark"){root.setAttribute("data-theme",choice)}
    else{choice="auto";root.setAttribute("data-theme","auto")}
    btns.forEach(function(b){
      var selected=b.dataset.themeChoice===choice;
      b.setAttribute("aria-checked",String(selected));
      b.setAttribute("tabindex",selected?"0":"-1");
    });
  }
  apply(get()||"auto");
  btns.forEach(function(b,index){b.addEventListener("click",function(){
    var c=b.dataset.themeChoice;try{localStorage.setItem(KEY,c)}catch(e){}apply(c);
  });b.addEventListener("keydown",function(event){
    var keys=["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"];
    if(keys.indexOf(event.key)===-1)return;
    event.preventDefault();
    var offset=event.key==="ArrowRight"||event.key==="ArrowDown"?1:-1;
    var nextIndex=event.key==="Home"?0:event.key==="End"?btns.length-1:(index+offset+btns.length)%btns.length;
    var next=btns[nextIndex];var c=next.dataset.themeChoice;
    try{localStorage.setItem(KEY,c)}catch(e){}apply(c);next.focus();
  })});
})();
</script>
</body></html>
