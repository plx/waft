<!DOCTYPE html>
<!-- @dsCard group="Colors" name="colors-primary" subtitle="Brand accents — teal + mustard" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Primary palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);font-family:var(--waft-font-sans);color:var(--waft-ink)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .sw{border:1px solid var(--waft-line);border-radius:var(--waft-radius);background:var(--waft-panel);overflow:hidden;box-shadow:var(--waft-shadow)}
  .chip{height:74px}
  .meta{padding:10px 12px;font-size:11px;line-height:1.4}
  .meta b{display:block;font-weight:700;font-size:13px;color:var(--waft-ink);margin-bottom:2px}
  .meta code{font-family:var(--waft-font-mono);color:var(--waft-muted);font-size:11px}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#16a085"></div><div class="meta"><b>accent</b><code>#16a085</code></div></div>
  <div class="sw"><div class="chip" style="background:#0f6e61"></div><div class="meta"><b>accent-dark</b><code>#0f6e61</code></div></div>
  <div class="sw"><div class="chip" style="background:#d6c24a"></div><div class="meta"><b>accent-2</b><code>#d6c24a</code></div></div>
  <div class="sw"><div class="chip" style="background:#dff5f1"></div><div class="meta"><b>accent-soft</b><code>#dff5f1</code></div></div>
  <div class="sw"><div class="chip" style="background:#fff8c9"></div><div class="meta"><b>air-soft</b><code>#fff8c9</code></div></div>
</div></body></html>
