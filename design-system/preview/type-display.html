<!DOCTYPE html>
<!-- @dsCard group="Type" name="type-display" subtitle="Inter 800 hero display" viewport="700x230" -->
<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--waft-surface);color:var(--waft-ink);font-family:var(--waft-font-sans)}
  .wrap{padding:24px}
  .display{font-size:64px;line-height:0.95;font-weight:800;letter-spacing:-0.01em;margin:0}
  .h2{font-size:36px;line-height:1.08;font-weight:800;margin:14px 0 0}
  .meta{display:flex;gap:14px;margin-top:12px;font-family:var(--waft-font-mono);font-size:11px;color:var(--waft-muted)}
  .meta span{padding:3px 7px;border:1px solid var(--waft-line);border-radius:4px;background:var(--waft-panel)}
</style></head><body><div class="wrap">
  <p class="display">Plan before<br>copying.</p>
  <div class="meta"><span>Inter 800</span><span>clamp(3rem, 8vw, 6rem)</span><span>line-height: 0.95</span><span>tracking: -0.01em</span></div>
</div></body></html>
