<!DOCTYPE html>
<!-- @dsCard group="Colors" name="colors-dark" subtitle="Dark-mode palette" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Dark mode palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#101512;color:#f8fafc;font-family:var(--waft-font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .sw{border:1px solid rgb(248 250 252 / 14%);border-radius:8px;background:#19201d;overflow:hidden}
  .chip{height:72px}
  .meta{padding:10px 12px;font-size:11px;line-height:1.4}
  .meta b{display:block;font-weight:700;font-size:12.5px;color:#f8fafc;margin-bottom:2px}
  .meta code{font-family:var(--waft-font-mono);color:#93a0aa;font-size:11px}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#8fd7cc"></div><div class="meta"><b>accent</b><code>#8fd7cc</code></div></div>
  <div class="sw"><div class="chip" style="background:#101512"></div><div class="meta"><b>surface</b><code>#101512</code></div></div>
  <div class="sw"><div class="chip" style="background:#19201d"></div><div class="meta"><b>panel</b><code>#19201d</code></div></div>
  <div class="sw"><div class="chip" style="background:#cbd5dc"></div><div class="meta"><b>ink-soft</b><code>#cbd5dc</code></div></div>
  <div class="sw"><div class="chip" style="background:#93a0aa"></div><div class="meta"><b>muted</b><code>#93a0aa</code></div></div>
</div></body></html>
