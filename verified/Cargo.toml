[package]
name = "waft-verified"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Verus-verified decision kernels used by waft"
license = "MIT"
repository = "https://github.com/plx/waft"
publish = false

[dependencies]
# Pinned to the exact Verus release in scripts/verus-verify.sh. Ordinary
# builds compile the `verus!` blocks with all specifications and proofs
# erased; `cargo verus verify -p waft-verified` checks them.
vstd = { version = "=0.0.0-2026-11-22-0344", default-features = false, features = ["std"] }

[package.metadata.verus]
verify = true

[lints.rust]
# `verus_keep_ghost` and friends are set only when Verus drives rustc.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)', 'cfg(verus_verify_core)'] }
