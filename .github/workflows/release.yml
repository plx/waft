name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  RUST_VERSION: "1.90.0"

jobs:
  check:
    name: Linux pre-release checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action, 2026-07-23
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt,clippy,llvm-tools-preview
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: just,cargo-audit,cargo-about,cargo-llvm-cov
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Verify tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "waft") | .version')"
          test "${GITHUB_REF_NAME}" = "v${crate_version}"

      - name: Verify tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Run release checks
        run: |
          just check-format
          just check-clippy
          just check-test
          just check-doc-test
          just check-doc-build
          just check-licenses
          just check-audit
          just check-coverage
          just check-self-test

      - name: Verify source package
        run: cargo package --locked

  macos-safety:
    name: macOS safety and hook checks
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action, 2026-07-23
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: just
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Run macOS regression suite
        run: |
          just check-test
          just check-self-test

  automation-lint:
    name: workflow and shell lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: shellcheck
      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"
      - run: actionlint
      - run: >-
          shellcheck
          scripts/install-hooks.sh
          scripts/self-test.sh
          scripts/artifact-smoke.sh
          hooks/dispatcher
          hooks/post-checkout

  build:
    name: ${{ matrix.archive }}
    needs: [check, macos-safety, automation-lint]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: waft-linux-x86_64
            binary: waft
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: waft-linux-aarch64
            binary: waft
          - os: macos-15
            target: aarch64-apple-darwin
            archive: waft-macos-aarch64
            binary: waft
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: waft-macos-x86_64
            binary: waft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action, 2026-07-23
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Assemble archive
        shell: bash
        run: |
          mkdir -p "staging/${{ matrix.archive }}" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "staging/${{ matrix.archive }}/"
          cp README.md LICENSE CHANGELOG.md SECURITY.md THIRD_PARTY_LICENSES.md ASSURANCE.md INSTALL.md \
            "staging/${{ matrix.archive }}/"
          tar -C staging -czf "dist/${{ matrix.archive }}.tar.gz" \
            "${{ matrix.archive }}"

      - name: Check archive and exercise extracted binary
        shell: bash
        run: |
          (cd dist && shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.sha256")
          (cd dist && shasum -a 256 -c "${{ matrix.archive }}.sha256")
          mkdir extracted
          tar -xzf "dist/${{ matrix.archive }}.tar.gz" -C extracted
          crate_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "waft") | .version')"
          bash scripts/artifact-smoke.sh "extracted/${{ matrix.archive }}/${{ matrix.binary }}" "$crate_version"

      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/${{ matrix.archive }}.tar.gz"

      - name: Verify archive provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh attestation verify "dist/${{ matrix.archive }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: "dist/*"
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
