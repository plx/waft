version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      site-dependencies:
        patterns: ["*"]
    ignore:
      # `@astrojs/check` (`astro check`) accepts only TypeScript ^5 || ^6.
      # Remove this once it accepts the next TypeScript major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
